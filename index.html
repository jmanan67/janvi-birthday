<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday, Janvi! ❤️</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Google Fonts: Playfair Display & Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,400&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #fffafb;
            color: #4a3b3c;
            overflow-x: hidden;
        }
        h1, h2, .romantic-font {
            font-family: 'Playfair Display', serif;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(3deg); }
        }
        .floating-heart {
            animation: float 4s ease-in-out infinite;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-pink-200">

    <!-- FLOATING BACKGROUND HEARTS -->
    <div class="fixed inset-0 pointer-events-none overflow-hidden z-0 opacity-20">
        <span class="absolute top-10 left-10 text-3xl floating-heart" style="animation-delay: 0s;">❤️</span>
        <span class="absolute top-1/4 right-16 text-2xl floating-heart" style="animation-delay: 1s;">🌸</span>
        <span class="absolute bottom-20 left-1/5 text-4xl floating-heart" style="animation-delay: 2s;">💖</span>
        <span class="absolute bottom-1/3 right-1/4 text-3xl floating-heart" style="animation-delay: 1.5s;">✨</span>
    </div>

    <!-- VIEW 1: LANDING PAGE -->
    <div id="landing-view" class="relative z-10 flex-1 flex flex-col items-center justify-center p-6 text-center transition-opacity duration-700">
        <div class="max-w-md w-full bg-white/80 backdrop-blur-md p-8 rounded-3xl shadow-xl border border-pink-100">
            <div class="w-32 h-32 mx-auto mb-6 rounded-full overflow-hidden border-4 border-pink-200 shadow-md">
                <!-- Cover Photo (Looks inside your 'images' folder) -->
                <img src="images/janvi.jpg" alt="Janvi" class="w-full h-full object-cover">
            </div>
            <span class="text-pink-500 text-sm tracking-widest uppercase font-medium">Special Birthday Surprise</span>
            <h1 class="text-4xl md:text-5xl font-bold text-stone-800 mt-2 mb-4">Happiest Birthday Janvi </h1>
            <p class="text-stone-600 text-sm mb-8 leading-relaxed">A little corner from your loved ones </p>
            <button onclick="openMainHub()" class="w-full py-4 px-8 bg-gradient-to-r from-rose-400 to-pink-500 text-white font-medium rounded-2xl shadow-lg hover:shadow-xl hover:from-rose-500 hover:to-pink-600 transition-all duration-300 cursor-pointer">
                Open Your Surprises 🤍
            </button>
        </div>
    </div>

    <!-- VIEW 2: MAIN HUB (WISHES GRID) -->
    <div id="main-hub" class="hidden relative z-10 flex-1 max-w-4xl w-full mx-auto p-6 py-12 transition-opacity duration-700">
        <div class="text-center mb-10">
            <span class="text-pink-500 text-xs tracking-widest uppercase font-medium">Birthday Confessions & Wishes</span>
            <h2 class="text-3xl md:text-4xl font-bold text-stone-800 mt-1">Made with love for you</h2>
            <p class="text-stone-500 text-sm mt-2">Tap any card below to watch their video message</p>
        </div>

        <!-- Cards Grid (Dynamically filled via JavaScript) -->
        <div id="cards-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
            <!-- Cards injected by JS -->
        </div>

        <div class="text-center mt-12">
            <button onclick="goBackHome()" class="text-xs text-stone-400 hover:text-stone-600 underline cursor-pointer">← Back to Cover</button>
        </div>
    </div>

    <!-- VIDEO MODAL POPUP -->
    <div id="video-modal" class="fixed inset-0 z-50 hidden bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl max-w-lg w-full overflow-hidden shadow-2xl relative animate-in fade-in zoom-in duration-200">
            <button onclick="closeVideoModal()" class="absolute top-4 right-4 z-10 w-9 h-9 bg-stone-100 hover:bg-stone-200 rounded-full flex items-center justify-center text-stone-600 transition-colors cursor-pointer">
                ✕
            </button>
            <div class="p-6 pb-2 border-b border-stone-100">
                <h3 id="modal-title" class="text-xl font-bold text-stone-800">Person Name</h3>
                <p class="text-xs text-pink-500 font-medium">Birthday Video Message</p>
            </div>
            <div class="p-6 bg-stone-900 flex items-center justify-center">
                <video id="modal-video" controls class="w-full max-h-[350px] rounded-xl object-contain">
                    Your browser does not support the video tag.
                </video>
            </div>
        </div>
    </div>

    <!-- FOOTER -->
    <footer class="relative z-10 text-center py-6 text-xs text-stone-400">
        Created with all my love for Janvi 🤍
    </footer>

    <!-- JAVASCRIPT LOGIC & CONFIGURATION -->
    <script>
        // ==========================================
        // CONFIGURATION: People & Media Files Matching Your Folders
        // ==========================================
        const contributors = [
          
            {
                name: "Mummy",
                image: "images/mummy.jpg",   
                video: "videos/mummy-janvi.mp4"
            },
            {
                name: "Papa",
                image: "images/papa.jpg",   
                video: "videos/papa-janvi.mp4"  
            },
            {
                name: "Vrinda",
                image: "images/vrinda.jpg",   
                video: "videos/vrinda.mp4"
            },
            {
                name: "Ritesh Papa & Mumma",
                image: "images/photo3.jpg",   
                video: "videos/vid3.mp4"
            },
            {
                name: "Chacha-chachi",
                image: "images/chacha.jpg",   
                video: "videos/vid2.mp4"},
            {
                name: "Nana-nani",
                image: "images/nani.jpg",   
                video: "videos/nana-nani1.mp4"
            },
            {
                name: "Mama",
                image: "images/mama.jpg",   
                video: "videos/mama.mp4"
            },
            {
                name: "Poorvansh",
                image: "images/poorvansh.jpg",   
                video: "videos/poorvansh.mp4"
            },
            {
                name: "vidit",
                image: "images/vidit.jpg",   
                video: "videos/vidit.mp4"
            },
            {
                name: "Bua , Akshu , Anushi",
                image: "images/anushi.jpg",   
                video: "videos/bua.mp4"
            },

             {
                name: "Manan",
                image: "images/manan-janvi.jpg",    
                video: "videos/manan.mp4"    
            },
            {
                name: "Anushree",
                image: "images/anushree.jpg",   
                video: "videos/friend1-message.mp4"  
            },
            {
                name: "Lakshay",
                image: "images/lakshay.jpg",   
                video: "videos/lakshay.mp4"  
            },
            {
                name: "Aanya",
                image: "images/aanya.jpg",   
                video: "videos/aanya.mp4"
            }
        ];

        // Populate Cards Grid on Load
        const grid = document.getElementById('cards-grid');
        contributors.forEach((person, index) => {
            const card = document.createElement('div');
            card.className = "bg-white p-5 rounded-3xl shadow-sm hover:shadow-md border border-pink-50 transition-all duration-300 flex flex-col items-center text-center group";
            card.innerHTML = `
                <div class="w-24 h-24 rounded-full overflow-hidden mb-4 border-2 border-pink-100 group-hover:border-pink-300 transition-colors">
                    <img src="${person.image}" alt="${person.name}" class="w-full h-full object-cover">
                </div>
                <h3 class="font-bold text-stone-800 text-lg mb-4">${person.name}</h3>
                <button onclick="openVideoModal(${index})" class="w-full py-2.5 px-4 bg-pink-50 hover:bg-pink-100 text-pink-600 font-medium text-sm rounded-xl transition-colors cursor-pointer">
                    Watch Video 🤍
                </button>
            `;
            grid.appendChild(card);
        });

        // Navigation Functions
        function openMainHub() {
            document.getElementById('landing-view').classList.add('hidden');
            document.getElementById('main-hub').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function goBackHome() {
            document.getElementById('main-hub').classList.add('hidden');
            document.getElementById('landing-view').classList.remove('hidden');
        }

        // Video Modal Functions
        const modal = document.getElementById('video-modal');
        const modalVideo = document.getElementById('modal-video');
        const modalTitle = document.getElementById('modal-title');

        function openVideoModal(index) {
            const person = contributors[index];
            modalTitle.textContent = `${person.name}'s Message`;
            modalVideo.src = person.video;
            modal.classList.remove('hidden');
            modalVideo.play().catch(e => console.log("Autoplay prevented:", e));
        }

        function closeVideoModal() {
            modal.classList.add('hidden');
            modalVideo.pause();
            modalVideo.currentTime = 0;
            modalVideo.src = "";
        }

        // Close modal when clicking outside of content
        modal.addEventListener('click', (e) => {
            if (e.target === modal) {
                closeVideoModal();
            }
        });
    </script>
</body>
</html>
